[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curtaincall"
version = "1.0.0"
description = "Policy-driven local release preparation and atomic Git publication."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Niels Madan" }]
dependencies = []
keywords = ["cli", "git", "releases", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/nielsmadan/curtaincall"
Repository = "https://github.com/nielsmadan/curtaincall"
Issues = "https://github.com/nielsmadan/curtaincall/issues"

[project.scripts]
curtains = "curtaincall.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=5", "ruff>=0.17.1", "pylint>=4.0.7", "mypy>=2.3.0"]

[tool.coverage.run]
source = ["curtaincall"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]
markers = ["integration: real Git or CLI subprocess tests", "packaging: distribution and isolated installation acceptance"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
extend-select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PL", "BLE", "S", "SLF", "RUF"]
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.pylint]
max-returns = 8
max-branches = 15
max-statements = 60
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001", "PLR2004"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["cyclic-import"]

[tool.pylint.reports]
score = false

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "scripts"]
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/curtaincall"]

[tool.hatch.build.targets.sdist]
include = ["src/curtaincall", "tests", "scripts", "docs", ".github", "README.md", "AGENTS.md", "CHANGELOG.md", "cliff.toml", "LICENSE", "pyproject.toml", "uv.lock", "Justfile", "lefthook.yml", ".python-version"]
exclude = ["docs/plans", "docs/longshot*"]
