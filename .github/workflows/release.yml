name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to publish (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: release-source
    outputs:
      release-commit: ${{ steps.identity.outputs.release-commit }}
      version: ${{ steps.project.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate annotated tag and ancestry
        id: identity
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Release retries must run from main" >&2
              exit 1
            fi
            RELEASE_COMMIT=$(python scripts/release_workflow.py validate-tag "$RELEASE_TAG")
          else
            RELEASE_COMMIT=$(python scripts/release_workflow.py \
              validate-tag "$RELEASE_TAG" "$GITHUB_SHA")
          fi
          echo "release-commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.identity.outputs.release-commit }}
          path: release-source
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.13"
          python-version: "3.13"
          working-directory: release-source
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - name: Validate project version
        id: project
        run: |
          python ../scripts/release_workflow.py project-metadata \
            "$RELEASE_TAG" pyproject.toml >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Static analysis
        run: just check-static
      - name: Tests with branch coverage
        run: just coverage
      - name: Distribution and installation tests
        run: just check-package
      - name: Build and smoke-test release assets
        env:
          VERSION: ${{ steps.project.outputs.version }}
        run: |
          just build
          for ARCHIVE in "dist/curtaincall-${VERSION}-py3-none-any.whl" "dist/curtaincall-${VERSION}.tar.gz"; do
            test -f "$ARCHIVE"
            ENV_DIR="$PWD/.cache/release/$(basename "$ARCHIVE")-env"
            uv venv --python 3.13 "$ENV_DIR"
            uv pip install --offline --no-deps --python "$ENV_DIR/bin/python" "$ARCHIVE"
            (
              cd "$RUNNER_TEMP"
              "$ENV_DIR/bin/curtains" --help
              test "$("$ENV_DIR/bin/curtains" --version)" = "curtains $VERSION"
            )
          done
      - name: Generate release notes and checksums
        run: |
          mkdir -p .cache/release/bundle/dist
          cp dist/* .cache/release/bundle/dist/
          uvx git-cliff@2.13.1 --config cliff.toml --current --strip all \
            -o .cache/release/bundle/release-notes.md
          (
            cd .cache/release/bundle/dist
            sha256sum ./*.whl ./*.tar.gz > SHA256SUMS
          )
      - name: Save verified release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: release-source/.cache/release/bundle
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Revalidate release commit
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
        run: |
          test "$(python scripts/release_workflow.py validate-tag \
            "$RELEASE_TAG" "$RELEASE_COMMIT")" = "$RELEASE_COMMIT"
      - name: Download verified release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release-bundle
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
        run: |
          python scripts/release_workflow.py publish \
            "$RELEASE_TAG" "Curtaincall $VERSION" \
            release-bundle/release-notes.md "$RELEASE_COMMIT" release-bundle/dist/*
