name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.13"
          python-version: "3.13"
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Static analysis and tests
        run: just check
      - name: Distribution and installation tests
        run: just check-package

  coverage-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.13"
          python-version: "3.13"
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Tests with branch coverage
        run: just coverage
      - name: Coverage summary
        run: uv run --locked coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: false
      - name: Build source distribution and wheel
        run: just build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  action:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record python3
        id: before
        run: echo "python3=$(command -v python3)" >> "$GITHUB_OUTPUT"
      - uses: ./
      - name: Verify installed command
        env:
          PYTHON3_BEFORE: ${{ steps.before.outputs.python3 }}
        run: |
          set -x
          test "$(command -v python3)" = "$PYTHON3_BEFORE"
          case "$(command -v curtains)" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          test "$(curtains --version)" = "curtains $version"
          git -c user.name=ci -c user.email=ci@example.invalid tag -a -m smoke v1000.0.0
          test "$(curtains ci previous-tag v1000.0.1)" = v1000.0.0
      - name: Validate release tag
        if: github.repository == 'nielsmadan/curtaincall'
        run: curtains ci validate-tag v1.0.0
